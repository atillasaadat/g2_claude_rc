# Every push to main tests, builds the glasses app, and deploys the relay Worker,
# which serves https://atillasaadat.com/g2-claude/ (guide), /app/ (glasses app)
# and the relay. The Even app loads the app from that URL, so the glasses pick up
# each deploy on their next launch without reinstalling.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare
# Workers", with Zone > Workers Routes > Edit on atillasaadat.com) and
# CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main]
    paths: ['apps/glasses/**', 'relay/**', 'packages/protocol/**', 'channel/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
# Read-only token; pinned action SHAs; dependency install scripts never run.
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Unit tests
        run: |
          (cd packages/protocol && bun test)
          (cd channel && bun test)
          (cd apps/glasses && bun test --path-ignore-patterns 'test/sim.e2e.test.ts')
      - name: Build the glasses app (fails if a secret lands in the bundle)
        run: cd apps/glasses && bun run build
      - name: Build the Even Hub packages (private builds; upload by hand in the dev portal)
        run: cd apps/glasses && bun run pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ehpk
          path: build/*.ehpk
      - name: Skip deploy (no Cloudflare token yet)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable deploys."
      - name: Deploy the Worker
        if: env.HAS_TOKEN == 'true'
        run: cd relay && bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
